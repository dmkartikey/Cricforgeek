name: Live feed results check (one-off)
# Read-only: lists the finished matches the live feed has stored. Changes nothing.
on:
  push:
    branches: [check-done]
    paths: [".github/workflows/check-done.yml"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          KEY: ${{ secrets.CRICDATA_KEY }}
        run: |
          W=https://cricforgeek-live.dmkartikey.workers.dev
          mkdir out && cd out
          curl -sS -m 20 $W/done | jq -r '.[] | .start[0:10] + " " + .fmt + " " + .gender + " | " + .teams[0] + " v " + .teams[1] + " | " + .status' > done.txt
          curl -sS -m 20 $W/live | jq -r '.matches[] | .start[0:10] + " " + .fmt + " | " + .teams[0] + " v " + .teams[1] + " | " + .status' > live.txt
          # series lookups: shapes only, a handful of calls
          C="https://api.cricapi.com/v1"
          curl -sS -m 30 "$C/series?apikey=$KEY&offset=0" | jq '{status, info: (.info | {hitsToday, hitsLimit}), n: (.data | length), sample: (.data[:40] | map({id, name, startDate, endDate, odi, t20, test, matches}))}' > series.json
          SID=$(jq -r '.sample[] | select(.name | test("India.*New Zealand|New Zealand.*India")) | .id' series.json | head -n1)
          curl -sS -m 30 "$C/series_info?apikey=$KEY&id=$SID" | jq '{status, info: .data.info, n: (.data.matchList | length), list: .data.matchList}' > series_info.json
          MID=$(jq -r '[.list[] | select(.matchEnded == true)][0].id' series_info.json)
          curl -sS -m 30 "$C/match_info?apikey=$KEY&id=$MID" | jq '{status, info: .info, data: (.data | del(.apikey))}' > match_info.json
          grep -l "$KEY" *.json && echo "key leaked, aborting" && exit 1
          git init -q -b check-done-results && git config user.name check && git config user.email check@users.noreply.github.com
          git add -A && git commit -q -m results && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-done-results
          cd ..
          echo "::notice::health $(curl -sS -m 20 $W/health | jq -c '{hitsToday,hitsLimit,lastScores,errors}')"
          echo "::notice::live $(curl -sS -m 20 $W/live | jq -c '[.matches[] | .start[0:10] + " " + .teams[0] + " v " + .teams[1] + " | " + .status]')"
