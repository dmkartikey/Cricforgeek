name: Site check (one-off)
# Read-only: fetches the live site and reports what visitors get. Changes nothing.
on:
  push:
    branches: [check-done]
    paths: [".github/workflows/check-done.yml"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          S=https://cricforgeek.site
          echo "::notice::dns $(getent hosts cricforgeek.site | tr '\n' ' ')"
          for u in / /players /player/ba607b88 /data/meta.json /data/search.json /data/home.json /data/photos/index.json /data/audit.json; do
            r=$(curl -sS -o /tmp/b -m 30 -w "%{http_code} %{size_download}B %{time_total}s" "$S$u" 2>&1 || true)
            echo "::notice::$u -> $r"
          done
          curl -sS -m 30 $S/ -o index.html || true
          echo "::notice::html head: $(head -c 300 index.html | tr '\n' ' ')"
          for a in $(grep -oE '/assets/[^"]+\.(js|css)' index.html | sort -u); do
            echo "::notice::asset $a -> $(curl -sS -o /dev/null -m 30 -w '%{http_code} %{size_download}B' $S$a)"
          done
          echo "::notice::headers $(curl -sSI -m 30 $S/ | tr '\r\n' '  ' | cut -c1-600)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium webkit >/dev/null 2>&1
          cat > t.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const { webkit, devices } = require('playwright');
            for (const [label, engine, dev] of [['iPhone Safari', webkit, devices['iPhone 13']], ['Android Chrome', chromium, devices['Pixel 7']]]) {
            const b = await engine.launch(); const ctx = await b.newContext({ ...dev }); const p = await ctx.newPage(); const errs = [];
            p.on('pageerror', (e) => errs.push('pageerror: ' + e.message));
            p.on('console', (m) => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
            p.on('requestfailed', (r) => errs.push('failed: ' + r.url() + ' ' + (r.failure()?.errorText ?? '')));
            for (const u of ['/', '/player/ba607b88', '/players']) {
              await p.goto('https://cricforgeek.site' + u, { waitUntil: 'networkidle', timeout: 45000 }).catch((e) => errs.push('goto: ' + e.message));
              await p.waitForTimeout(2500);
              const t = await p.evaluate(() => document.querySelector('main')?.innerText?.slice(0, 160) ?? document.body.innerText.slice(0, 160));
              console.log(`::notice::${label} render ${u}: ${t.replace(/\s+/g, ' ').slice(0, 110)}`);
            }
            console.log(`::notice::${label} errors ` + (errs.slice(0, 8).join(' | ') || 'none').slice(0, 1500));
            await b.close();
            }
          })();
          JS
          node t.cjs
