name: Live feed results check (one-off)
# Read-only: lists the finished matches the live feed has stored. Changes nothing.
on:
  push:
    branches: [check-done]
    paths: [".github/workflows/check-done.yml"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          KEY: ${{ secrets.CRICDATA_KEY }}
        run: |
          W=https://cricforgeek-live.dmkartikey.workers.dev
          mkdir out && cd out
          curl -sS -m 20 $W/done | jq -r '.[] | .start[0:10] + " " + .fmt + " " + .gender + " | " + .teams[0] + " v " + .teams[1] + " | " + .status' > done.txt
          curl -sS -m 20 $W/live | jq -r '.matches[] | .start[0:10] + " " + .fmt + " | " + .teams[0] + " v " + .teams[1] + " | " + .status' > live.txt
          # series lookups: raw responses trimmed, a handful of calls
          set +e
          C="https://api.cricapi.com/v1"
          curl -sS -m 30 "$C/series?apikey=$KEY&offset=0&search=India" > series.json
          SID=$(jq -r '.data[]? | select(.name | test("India.*New Zealand|New Zealand.*India")) | .id' series.json | head -n1)
          echo "SID=$SID" > ids.txt
          curl -sS -m 30 "$C/series_info?apikey=$KEY&id=$SID" > series_info.json
          MID=$(jq -r '[.data.matchList[]? | select(.matchEnded == true)][0].id' series_info.json)
          echo "MID=$MID" >> ids.txt
          curl -sS -m 30 "$C/match_info?apikey=$KEY&id=$MID" > match_info.json
          if grep -q -- "$KEY" *.json *.txt; then sed -i "s/$KEY/REDACTED/g" *.json *.txt; fi
          set -e
          git init -q -b check-done-results && git config user.name check && git config user.email check@users.noreply.github.com
          git add -A && git commit -q -m results && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-done-results
          cd ..
          echo "::notice::health $(curl -sS -m 20 $W/health | jq -c '{hitsToday,hitsLimit,lastScores,errors,seriesMore,series}')"
          echo "::notice::live $(curl -sS -m 20 $W/live | jq -c '[.matches[] | .start[0:10] + " " + .teams[0] + " v " + .teams[1] + " | " + .status]')"
