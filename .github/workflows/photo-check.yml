name: Photo check (one-off)

# Fetches free-licence sample photos and coverage numbers, and pushes them to the photo-check-results branch.
on:
  push:
    branches: [photo-check]
    paths: [".github/workflows/photo-check.yml", "scripts/photo_check.py"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run
        run: |
          pip install -q "rembg[cpu]==2.0.66" pillow
          python scripts/photo_check.py out
      - name: Push results
        run: |
          cd out
          git init -q -b photo-check-results
          git config user.name "photo-check" && git config user.email "photo-check@users.noreply.github.com"
          git add -A && git commit -q -m "photo check results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" photo-check-results
