name: Audit snapshot (temporary)
on:
  push:
    branches: [ui-audit-seo]
    paths: [".github/audit/**", ".github/workflows/audit-snap.yml"]
permissions: {}
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: repo }
      - name: Snapshot live site
        run: |
          mkdir -p out/shots out/seo work && cd work && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp ../repo/.github/audit/snap.mjs . && node snap.mjs ../out
      - name: SEO checks
        run: |
          cd out/seo
          for p in / /players /player/ba607b88 /team/india /league/ipl /matches /live /methodology /robots.txt /sitemap.xml /sitemap-players.xml /llms.txt /player/does-not-exist /tests /leagues; do
            echo "=== $p" >> status.txt
            curl -s -o /dev/null -w "%{http_code} %{redirect_url} %{content_type} %{size_download}\n" "https://cricforgeek.site$p" >> status.txt
          done
          curl -s https://cricforgeek.site/ > home.html
          curl -s https://cricforgeek.site/player/ba607b88 > player.html
          curl -s https://cricforgeek.site/robots.txt > robots.txt
          curl -s https://cricforgeek.site/sitemap.xml > sitemap.xml
          curl -s https://cricforgeek.site/sitemap-players.xml | head -c 3000 > sitemap-players-head.xml
          curl -s https://cricforgeek.site/sitemap-matches.xml | grep -c "<url>" > sitemap-matches-count.txt || true
          curl -sI https://www.cricforgeek.site/ > www-headers.txt || true
          curl -sI http://cricforgeek.site/ > http-headers.txt || true
          curl -sI https://dmkartikey.github.io/cricforgeek/ > ghio-headers.txt || true
      - name: Commit to audit-snapshots branch
        run: |
          cd out && git init -q && git checkout -q -b audit-snapshots && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm "audit snapshot ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" audit-snapshots
