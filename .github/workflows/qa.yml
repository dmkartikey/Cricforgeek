name: Site QA (one-off)
# Read-only against the live site: crawls pages, scores photos, and pushes the report to the qa-results branch.
on:
  push:
    branches: [qa]
    paths: [".github/workflows/qa.yml", "qa/**"]
permissions:
  contents: write
concurrency: { group: qa, cancel-in-progress: true }
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Photo review
        if: ${{ contains(github.event.head_commit.message, '[pick]') }}
        run: |
          pip install -q pillow
          python qa/photo_pick.py https://cricforgeek.site out qa/pick-names.txt
      - name: Getty probe
        if: ${{ contains(github.event.head_commit.message, '[getty]') }}
        run: |
          python qa/getty_probe.py
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          (cd qa/gtest && python3 -m http.server 8099 >/dev/null 2>&1 &) ; sleep 2
          node qa/gtest/run.cjs
      - name: Phone screenshots
        if: ${{ contains(github.event.head_commit.message, '[shot]') }}
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          node qa/shot.cjs
      - name: Photo QC
        if: ${{ !contains(github.event.head_commit.message, '[pick]') && !contains(github.event.head_commit.message, '[shot]') && !contains(github.event.head_commit.message, '[getty]') }}
        run: |
          pip install -q "opencv-python-headless==4.10.0.84" pillow numpy
          python qa/photo_qc.py https://cricforgeek.site out
      - name: Crawl
        if: ${{ !contains(github.event.head_commit.message, '[photos only]') && !contains(github.event.head_commit.message, '[pick]') && !contains(github.event.head_commit.message, '[shot]') && !contains(github.event.head_commit.message, '[getty]') }}
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          node qa/crawl.cjs
      - name: Publish report
        if: always()
        run: |
          rm -rf out/photos
          cd out && git init -q -b qa-results && git add -A && git -c user.name=qa -c user.email=qa@users.noreply.github.com commit -qm "qa $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results
