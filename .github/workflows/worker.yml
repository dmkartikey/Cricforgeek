name: Live feed worker deploy

# Deploys the cricforgeek-live Cloudflare Worker that fetches live scores and odds for the Live page.
# Needs four repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CRICDATA_KEY, ODDS_API_KEY.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Check the Cloudflare token
        run: |
          for u in "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                   "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            if curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$u" | jq -e '.success and .result.status == "active"' >/dev/null 2>&1; then
              echo "Token is active."; exit 0
            fi
          done
          echo "::error::The CLOUDFLARE_API_TOKEN secret was not accepted. Re-save it with only the token text (no 'Bearer', quotes, spaces or other lines)."
          exit 1

      - name: Find or create the storage namespace
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r '.result[] | select(.title == "cricforgeek-live") | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" --data '{"title":"cricforgeek-live"}' "$api" | jq -r '.result.id')
            echo "Created the storage namespace."
          fi
          if ! [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then echo "::error::Could not find or create the storage namespace. The token needs Workers KV Storage: Edit."; exit 1; fi
          sed -i "s/KV_NAMESPACE_ID/$id/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy

      - name: Store the API keys in the worker
        env:
          CRICDATA_KEY: ${{ secrets.CRICDATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          jq -n '{CRICDATA_KEY: env.CRICDATA_KEY, ODDS_API_KEY: env.ODDS_API_KEY}' | npx wrangler secret bulk

      - name: Health check
        working-directory: .
        run: |
          sleep 90
          curl -fsS https://cricforgeek-live.dmkartikey.workers.dev/health | jq '{ok, scores, odds, hitsToday, hitsLimit, oddsRemaining, lastScores, errors}' || echo "::warning::Health check did not answer yet."
