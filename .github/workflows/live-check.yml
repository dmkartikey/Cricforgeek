# One-off connection check for the live feed: confirms each key works and prints the shape of each reply.
# Uses 2 CricketData calls and 1 odds credit. Keys come from repository secrets; GitHub masks them in logs.
name: Live feed check

on:
  workflow_dispatch:
  push:
    branches: [v7]
    paths: [.github/workflows/live-check.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CRICDATA_KEY: ${{ secrets.CRICDATA_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets present
        run: |
          for v in CRICDATA_KEY ODDS_API_KEY CF_TOKEN CF_ACCOUNT; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v: set, ${#val} characters"; else echo "$v: MISSING"; fi
          done

      - name: Cloudflare token
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status, errors}'
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces" | jq '{success, count: (.result | length), errors}'
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq '{success, subdomain: .result.subdomain, errors}'

      - name: CricketData current matches (1 call)
        run: |
          curl -s "https://api.cricapi.com/v1/currentMatches?apikey=$CRICDATA_KEY&offset=0" > cm.json
          jq '{status, info, count: (.data | length)}' cm.json
          echo "--- match types and states"
          jq -r '.data[] | [.matchType, (.matchStarted|tostring), (.matchEnded|tostring), .name, .status] | @tsv' cm.json | head -40
          echo "--- first started, unfinished match (full shape)"
          jq '[.data[] | select(.matchStarted and (.matchEnded|not))][0]' cm.json
          echo "--- keys seen"
          jq '[.data[] | keys] | add | unique' cm.json

      - name: CricketData scorecard (1 call)
        run: |
          id=$(jq -r '[.data[] | select(.matchStarted and (.matchEnded|not))][0].id // .data[0].id' cm.json)
          echo "match id: $id"
          curl -s "https://api.cricapi.com/v1/match_scorecard?apikey=$CRICDATA_KEY&id=$id" > sc.json
          jq '{status, info, dataKeys: (.data | keys)}' sc.json
          jq '.data.scorecard[0] | {inning, battingKeys: (.batting[0] | keys), batting0: .batting[0], bowling0: .bowling[0], extras, totals}' sc.json
          jq '.data | {score, teamInfo, tossWinner, tossChoice, matchWinner, status}' sc.json

      - name: Odds API (sports list free, 1 odds credit)
        run: |
          curl -s "https://api.the-odds-api.com/v4/sports?apiKey=$ODDS_API_KEY&all=true" > sports.json
          jq -r '.[] | select(.group == "Cricket") | [.key, .title, (.active|tostring)] | @tsv' sports.json
          key=$(jq -r '[.[] | select(.group == "Cricket" and .active)][0].key // empty' sports.json)
          if [ -n "$key" ]; then
            curl -s -D h.txt "https://api.the-odds-api.com/v4/sports/$key/odds?apiKey=$ODDS_API_KEY&regions=uk&markets=h2h&oddsFormat=decimal" > odds.json
            grep -i "x-requests" h.txt
            jq '{count: length, first: (.[0] | {sport_key, commence_time, home_team, away_team, nBooks: (.bookmakers | length), market0: .bookmakers[0].markets[0]})}' odds.json
          else
            echo "no active cricket odds right now"
          fi
