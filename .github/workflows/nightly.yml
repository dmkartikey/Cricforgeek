name: Nightly data build & deploy

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (07:47 IST)
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs. Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt pytest

      - name: Test pipeline
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Download Cricsheet data
        run: |
          curl -fsSL --retry 4 -o all_json.zip https://cricsheet.org/downloads/all_json.zip
          curl -fsSL --retry 4 -o people.csv https://cricsheet.org/register/people.csv
          ls -la all_json.zip people.csv

      - name: Build stats
        working-directory: pipeline
        env:
          CFG_MEMORY: 8GB
        run: python -m cricforgeek.build --zip ../all_json.zip --people ../people.csv --work ../work --out ../web/public/data

      # How complete Cricsheet is for each international format and year (from the official match numbers).
      - name: Coverage
        continue-on-error: true
        run: |
          python pipeline/scripts/match_coverage.py all_json.zip web/public/data 2>&1 | tee coverage.log
          echo "::notice::$(tail -n 1 coverage.log)"

      # Recount every innings from the raw files with a separate parser and check the published files agree.
      # Reported on the Methodology page; a failed check is flagged as a warning, not a failed build.
      - name: Data audit
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python pipeline/scripts/audit.py all_json.zip work web/public/data 2>&1 | tee audit.log
          head -n 1 audit.log | sed 's/^/::notice::/'
          python -c "import json,sys; a=json.load(open('web/public/data/audit.json')); sys.exit(0 if a['ok'] else 1)" || echo "::warning::data audit found mismatches: $(tail -n +2 audit.log | head -n 5 | tr '\n' ' ')"

      # Player-card photos: free-licence Wikimedia images for top-team players, cut out once and cached between runs.
      - name: Restore photo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: photo-cache
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      # Full names and aliases for search ("Virat Kohli" for "V Kohli"), from Wikidata, cached with the photos.
      - name: Full names for search
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python pipeline/scripts/fullnames.py people.csv web/public/data photo-cache 2>&1 | tee names.log
          echo "::notice::names: $(tail -n 1 names.log)"

      # Photos run on Python 3.12, where the background-removal package installs cleanly (3.13 is not supported yet).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Player photos
        continue-on-error: true
        timeout-minutes: 40
        working-directory: pipeline  # the database points at its data files relative to this folder
        run: |
          python -m pip install -q "rembg[cpu]==2.0.66" pillow "$(grep -i '^duckdb' requirements.txt)"
          python scripts/photos.py ../people.csv ../work ../web/public/data ../photo-cache 2>&1 | tee photo.log
          echo "::notice::photos: $(tail -n 1 photo.log)"
          grep -E "^(photo sources|most-capped|photo check)" photo.log | cut -c1-900 | sed 's/^/::notice::/' || true
          # why new photos were skipped: the first few, so a bad source shows up in the run summary
          echo "::notice::photo skips ($(grep -c '^skip' photo.log || true)): $(grep -E '^skip|unavailable|failed' photo.log | head -n 6 | tr '\n' '|' | cut -c1-900)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          # Track record for the Live page from the live feed's finished matches. Skips itself if the feed is down.
          npm run record || true
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
