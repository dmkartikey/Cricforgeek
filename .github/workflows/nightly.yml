name: Nightly data build & deploy

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (07:47 IST)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt pytest

      - name: Test pipeline
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Download Cricsheet data
        run: |
          curl -fsSL --retry 4 -o all_json.zip https://cricsheet.org/downloads/all_json.zip
          curl -fsSL --retry 4 -o people.csv https://cricsheet.org/register/people.csv
          ls -la all_json.zip people.csv

      - name: Build stats
        working-directory: pipeline
        env:
          CFG_MEMORY: 8GB
        run: python -m cricforgeek.build --zip ../all_json.zip --people ../people.csv --work ../work --out ../web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
