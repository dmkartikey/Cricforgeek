name: Cloudflare token check (one-off)

# Read-only: checks the token is active and can see Workers storage. Deploys nothing.
on:
  push:
    branches: [v7]
    paths: [".github/workflows/token-check.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check token
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "::notice::Token length ${#CLOUDFLARE_API_TOKEN}, account id length ${#CLOUDFLARE_ACCOUNT_ID}"
          ok=no
          for u in "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                   "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            s=$(curl -sS -H "$auth" "$u" | jq -r '.result.status // (.errors[0].message // "no answer")')
            echo "::notice::verify -> $s"
            [ "$s" = "active" ] && ok=yes
          done
          kv=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=5" | jq -r 'if .success then "ok" else (.errors[0].message // "failed") end')
          echo "::notice::storage access -> $kv"
          w=$(curl -sS -H "$auth" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r 'if .success then "subdomain " + .result.subdomain else (.errors[0].message // "failed") end')
          echo "::notice::workers access -> $w"
          [ "$ok" = yes ] && [ "$kv" = ok ]
